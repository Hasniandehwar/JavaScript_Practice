<!-- # Main dashboard -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assest/css/base.css">
    <link rel="stylesheet" href="assest/css/components.css">
    <link rel="stylesheet" href="./assest/css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
 </head>
 <body class="dashboard_body">
   <main class="main_dahboard d-flex p-3 gap-2">
      <aside class="d-flex flex-column aside_dash algin-item-center  p-3 w-25" >
         <div class="name text-center p-2">
            <h1> <em style="color: green; letter-spacing: 3px;">X</em>tech</h1>
         </div>
         <div class="btns d-flex flex-column align-items-start  h-100 mt-3 p-3 ">

               <button class="btn btn-success  mb-3 w-100 active" id="Dash_btn">Dashboard</button>
               <button class="btn btn-success  mb-3 w-100" id="orders_btn">Orders</button>
               <button class="btn btn-success  mb-3 w-100" id="products_btn">Products</button>

               <!-- Manage Store -->
               <button class="btn btn-success  mb-2 w-100" id="Manage_store">Manage Store</button>

               <!-- Sub Menu -->
               <div class="d-flex flex-column align-items-center  btn_div p-3 collapse-box"id="btns_Drop">
                     <button class="btn btn-outline-success mb-2 w-100" id="Product">Products CRUD</button>
      </div>
         </div>
      </aside>
      <section class="section_dashboard  p-4 w-100">

         <div class="container">
            <div class="row  justify-content-center gap-3 p-4 ">
               <div class="col-5  p-5 form ">
                  <span class="text-center mb-3"><h4>Manage Stock</h4></span>
                     <form class="row needs-validation mt-3 justify-content-center p-3">
                        <div class="col-md-12 mb-2">
                           <label for="Category" class="form-label">Product Cetegory:</label>
                           <select class="form-select form-select-sm mb-3">
                                <option selected >Choose Category</option>
                                <option value="1">One</option>
                                <option value="2">Two</option>
                                <option value="3">Three</option>
                           </select>
                        </div>
<!-- in will appear on screen while category part is selected -->
                        <div class="col-md-12 mb-3" id="Tag"> 
                           <label for="Products" class="form-label">Product:</label>
                           <select class="form-select form-select-sm mb-3">
                                <option selected >Choose Category</option>
                                <option value="1">One</option>
                                <option value="2">Two</option>
                                <option value="3">Three</option>
                           </select>
                        </div>
                        <div class="col-md-12 mb-3">
                           <label for="Stock" class="form-label">Stock:</label>
                           <input type="text" name="Stock" class="form-control" placeholder="Stock">
                        </div>

                        <div class="col-md-5 mb-2"  id="btn_div">
                           <button type="submit" class="btn btn-success">Add Stock</button>
                        </div>

                        <div class="">
                           Stock Added
                        </div>
                        </form>

            </div>
               <div class="col-5 p-5 form" >
                  <span class="text-center mb-3"><h4>Add Product</h4></span>

                  <form class="row needs-validation mt-3 justify-content-center p-3" >
                        <div class="col-md-12 mb-2">
                           <label for="Category" class="form-label">Product Cetegory:</label>
                           <select class="form-select form-select-sm mb-3">
                                <!-- product categories load here -->
                                 <option selected>Product Categories</option>
                           </select>
                        </div>
<!-- in will appear on screen while category part is selected -->
                         <div class="col-md-12 mb-3">
                           <label for="ProductName" class="form-label">Product Name:</label>
                           <input type="text" name="ProductName" class="form-control" required placeholder="Product Name">
                        </div>

                        <div class="col-md-12 mb-3">
                           <label for="Stock" class="form-label">Stock:</label>
                           <input type="text" name="Stock" class="form-control" placeholder="Stock">
                        </div>

                        <div class="col-md-6 mb-2" id="btn_div">
                           <button type="submit" class="btn btn-success">Add Product</button>
                        </div>

                        <div class="">
                           Stock Added
                        </div>
                        </form>
               </div>
            </div>
         </div>
      </section>
   </main>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
   <script type="module" src="./scripts/data/seed.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
   <script type="module" src="./scripts/pages/dashboard.page.js"></script>
 </body>
 </html>
